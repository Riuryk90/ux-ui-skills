<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Flujo local del plugin en Claude Code</title>
  <desc id="desc">Flujo que muestra clonar, cargar, verificar, usar y recargar el plugin UX/UI Skills en Claude Code.</desc>
  <rect width="1200" height="520" fill="#0f172a"/>
  <text x="70" y="78" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">UX/UI Skills con Claude Code</text>
  <text x="70" y="116" font-family="Arial, sans-serif" font-size="18" fill="#cbd5e1">Ruta local: clonar el repo, cargar el plugin, confirmar las skills y usar el comando correcto.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 175)">
      <rect width="190" height="150" rx="8" fill="#163247" stroke="#38bdf8" stroke-width="2"/>
      <text x="24" y="42" font-size="18" font-weight="700" fill="#f8fafc">1. Clonar</text>
      <text x="24" y="78" font-size="15" fill="#dbeafe">git clone</text>
      <text x="24" y="103" font-size="15" fill="#dbeafe">Riuryk90/</text>
      <text x="24" y="128" font-size="15" fill="#dbeafe">ux-ui-skills</text>
    </g>
    <path d="M285 250h65" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(370 175)">
      <rect width="190" height="150" rx="8" fill="#1f2f22" stroke="#22c55e" stroke-width="2"/>
      <text x="24" y="42" font-size="18" font-weight="700" fill="#f8fafc">2. Cargar</text>
      <text x="24" y="78" font-size="15" fill="#dcfce7">claude</text>
      <text x="24" y="103" font-size="15" fill="#dcfce7">--plugin-dir .</text>
    </g>
    <path d="M585 250h65" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(670 175)">
      <rect width="190" height="150" rx="8" fill="#35254c" stroke="#a78bfa" stroke-width="2"/>
      <text x="24" y="42" font-size="18" font-weight="700" fill="#f8fafc">3. Verificar</text>
      <text x="24" y="78" font-size="15" fill="#ede9fe">/help</text>
      <text x="24" y="103" font-size="15" fill="#ede9fe">buscar namespace</text>
      <text x="24" y="128" font-size="15" fill="#ede9fe">ux-ui-skills</text>
    </g>
    <path d="M885 250h65" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(970 175)">
      <rect width="190" height="150" rx="8" fill="#45251c" stroke="#fb923c" stroke-width="2"/>
      <text x="24" y="42" font-size="18" font-weight="700" fill="#f8fafc">4. Usar</text>
      <text x="24" y="78" font-size="15" fill="#ffedd5">review:</text>
      <text x="24" y="103" font-size="15" fill="#ffedd5">auditoria sin editar</text>
      <text x="24" y="128" font-size="15" fill="#ffedd5">build: mejorar UI</text>
    </g>
    <rect x="315" y="380" width="570" height="70" rx="8" fill="#111827" stroke="#475569"/>
    <text x="350" y="423" font-size="18" fill="#f8fafc">Después de editar, ejecuta <tspan fill="#86efac">/reload-plugins</tspan> para refrescar la sesión.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
